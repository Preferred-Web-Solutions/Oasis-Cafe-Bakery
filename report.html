<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Report a Website Issue — The Oasis Cafe & Bakery</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F0DC;--panel:#EFE2BE;--ink:#2B2015;--muted:#6E5E45;--gold:#AD7B23;--teal:#1E4B4A;--line:#E1D2A6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.6 "Public Sans",system-ui,sans-serif}
h1{font-family:"Cormorant Garamond",Georgia,serif;color:var(--teal);margin:0 0 .3rem;font-size:clamp(1.8rem,4vw,2.4rem);font-weight:600}
a{color:var(--gold)}
.wrap{max-width:640px;margin:0 auto;padding:3rem clamp(1.2rem,4vw,3rem)}
.backlink{display:inline-block;margin-bottom:1.4rem;font-weight:600;font-size:.9rem;text-decoration:none;color:var(--teal)}
p.lede{color:var(--muted);margin:0 0 1.8rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.8rem}
label{display:block;font-weight:600;font-size:.9rem;margin-top:1rem}
input,textarea,select{width:100%;font:inherit;padding:.65rem;margin-top:.3rem;border:2px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
.hint{color:var(--muted);font-size:.82rem;font-weight:400}
.submitbtn{margin-top:1.3rem;background:var(--teal);color:#fff;border:0;border-radius:8px;padding:.85rem 1.5rem;font-weight:700;cursor:pointer;font-size:1rem}
.submitbtn:disabled{opacity:.6;cursor:default}
.note{margin-top:.8rem;font-weight:600;font-size:.9rem}
.note.err{color:#B33}
.note.ok{color:var(--teal)}
.confirm{text-align:center;padding:1rem 0}
.confirm .check{width:56px;height:56px;line-height:56px;border-radius:50%;background:var(--teal);color:#fff;font-size:1.6rem;margin:0 auto .9rem;display:block}
.confirm h2{font-family:"Cormorant Garamond",Georgia,serif;color:var(--teal);margin:0 0 .5rem;font-size:1.6rem;font-weight:600}
.confirm p{color:var(--muted);margin:0}
</style>
</head>
<body>
<div class="wrap">
 <a class="backlink" href="index.html">&#8592; Back to the main site</a>
 <h1>Report a website issue</h1>
 <p class="lede">Something not working right — a broken link, an order that wouldn't go through, a page that looks off? Let us know and we'll take a look.</p>
 <div class="card">
  <form id="reportForm">
   <label for="rname">Name <span class="hint">(optional)</span></label>
   <input id="rname" name="Name">
   <label for="remail">Email <span class="hint">(optional — so we can follow up)</span></label>
   <input id="remail" name="Email" type="email">
   <label for="rpage">Which page?</label>
   <select id="rpage" name="Page">
    <option>Home page</option>
    <option>Order online page</option>
    <option>Something else / not sure</option>
   </select>
   <label for="rdesc">What happened? <span class="hint">(required)</span></label>
   <textarea id="rdesc" name="What happened" rows="5" required placeholder="e.g. The Add button on the Manti item didn't do anything on my phone"></textarea>
   <button class="submitbtn" id="rsubmit" type="submit">Send report</button>
   <p class="note" id="rmsg"></p>
  </form>
  <div class="confirm" id="confirmScreen" hidden>
   <span class="check">&#10003;</span>
   <h2>Report received</h2>
   <p>Thanks for letting us know — we'll take a look and follow up if you left an email.</p>
  </div>
 </div>
</div>
<script>
const $=id=>document.getElementById(id);
const ENDPOINT="https://formspree.io/f/xgavryzg";
$("reportForm").addEventListener("submit", async (e)=>{
 e.preventDefault();
 const desc=$("rdesc").value.trim();
 if(!desc){$("rmsg").className="note err";$("rmsg").textContent="Please describe what happened.";return}
 const btn=$("rsubmit");btn.disabled=true;
 $("rmsg").className="note";$("rmsg").textContent="Sending…";
 const fd=new FormData();
 fd.append("Business",document.title.replace("Report a Website Issue — ",""));
 fd.append("Name",$("rname").value.trim());
 fd.append("Email",$("remail").value.trim());
 fd.append("Page",$("rpage").value);
 fd.append("What happened",desc);
 fd.append("URL",location.href);
 try{
  const res=await fetch(ENDPOINT,{method:"POST",body:fd,headers:{"Accept":"application/json"}});
  if(!res.ok){
   let detail="";
   try{const j=await res.json();if(j&&Array.isArray(j.errors))detail=j.errors.map(x=>x.message||x.code).join("; ");else if(j&&j.error)detail=j.error}catch(_){}
   throw new Error("Could not send ("+res.status+(detail?" — "+detail:"")+")");
  }
  $("reportForm").hidden=true;
  $("rmsg").className="note ok";
  $("rmsg").textContent="Thanks — your report was sent. We'll take a look.";
  $("confirmScreen").hidden=false;
 }catch(err){
  $("rmsg").className="note err";
  $("rmsg").textContent=(err&&err.message)||"Something went wrong — please try again, or call us directly.";
  btn.disabled=false;
 }
});
</script>
</body>
</html>
